# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    # What a caller links in when they import this package. gofbp is arithmetic
    # on floats: no files, no network, no exec, no reflection, no cgo. That is
    # not a baseline to be re-recorded when it moves — it is the invariant, and
    # the empty set below is the whole expected value.
    #
    # Deliberately not a checked-in capabilities.json. A baseline file is the
    # thing someone regenerates to make CI green; an empty set written here can
    # only be widened by editing this workflow, in the diff, on purpose.
    #
    # It earns a step because the failure is quiet. Reaching for os.Getenv to
    # read a fuel table, or a logging package that opens a file, breaks no test
    # at all; it changes what every consumer is trusting, and it does not look
    # like anything in a diff full of coefficients.
    #
    # Pinned, not @latest: Capslock ships new capability mappings between
    # releases, so an unpinned tool can turn an unchanged package red on a day
    # nobody touched it.
    #
    # Test files are out of scope. The fixture tests read testdata and shell out
    # to Docker, which is fine, and is not what a consumer links.
    #
    # `.` and not `./...`, for the same reason. This was ./... when the module
    # was a single package and the two meant the same thing. They no longer do:
    # tools/ holds command-line programs that read files, call GitHub and shell
    # out to git and docker -- that IS their job -- and internal/ledger reads
    # MIGRATION.md and cannot be imported from outside this module at all.
    # Neither is reachable from an `import "github.com/LukasSelin/gofbp"`, so
    # neither is part of what this step is asserting. Widening the scope back
    # would only make the empty set unholdable and invite someone to replace it
    # with a baseline file, which is precisely what the note above refuses.
    - name: Check the package still has no capabilities
      run: |
        go install github.com/google/capslock/cmd/capslock@v0.3.3
        echo '{}' > "$RUNNER_TEMP/no-capabilities.json"
        capslock -packages=. -output=compare "$RUNNER_TEMP/no-capabilities.json"
